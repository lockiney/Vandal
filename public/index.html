<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/logo.png">
    <title>Vandal</title>
    <style>
        * {
            font-family: 'Permanent Marker', cursive;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        input {
            -webkit-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            box-sizing: border-box;
            padding-top: 80px;
            padding-bottom: 100px;
            background: linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)),
                        url('https://wallpaperaccess.com/full/2238315.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        input, button { font-family: 'Permanent Marker', cursive !important; }
        .main-logo {
            height: 300px;
            width: auto;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
            animation: float 3s ease-in-out infinite;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        @keyframes float {
            0%   { transform: translateY(0px);  filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
            50%  { transform: translateY(-15px); filter: drop-shadow(0 0 25px rgba(255,255,255,0.8)); }
            100% { transform: translateY(0px);  filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
        }
        #paintCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 9999;
            pointer-events: none;
        }
        #proxy-container {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgb(255,255,255);
            z-index: 99998;
            margin: 0; padding: 0;
        }
        #loading-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100000;
            background: linear-gradient(135deg, #4c1d95, #64748b);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .loader-text {
            font-size: 50px;
            color: white;
            letter-spacing: 10px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }
        #progress-bar-wrap {
            width: 280px; height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 16px auto 0;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #a78bfa, #c084fc);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        #progress-text {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            margin-top: 8px;
            font-family: 'Permanent Marker', cursive;
        }
        .search-container {
            transition: all 0.3s ease;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50px;
        }
        .search-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255,255,255,0.4), 0 0 40px rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.8);
        }
        .spacer { flex-grow: 1; }
        button { color: white; font-weight: bold; text-shadow: 0 0 8px rgba(255,0,238,0.5); }
        input::placeholder { color: rgba(255,255,255,0.5); text-shadow: 0 0 5px rgba(255,0,238,0.5); }
        #spray-nav {
            position: fixed;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .can-body {
            background: rgba(20,20,35,0.92);
            border: 1.5px solid rgba(167,139,250,0.25);
            border-radius: 28px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 0 20px rgba(167,139,250,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
        }
        .can-tip {
            width: 14px; height: 10px;
            background: rgba(20,20,35,0.92);
            border: 1.5px solid rgba(167,139,250,0.25);
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            margin-bottom: -1px;
        }
        .can-nozzle {
            width: 8px; height: 6px;
            background: rgba(192,132,252,0.7);
            border-radius: 2px 2px 0 0;
            margin-bottom: -1px;
            box-shadow: 0 0 6px rgba(192,132,252,0.5);
        }
        .can-divider {
            width: 28px; height: 1px;
            background: rgba(167,139,250,0.15);
            margin: 2px 0;
        }
        .color-picker-popup {
            position: absolute;
            left: 56px;
            bottom: 0;
            background: rgba(20,20,35,0.97);
            border: 1px solid rgba(167,139,250,0.25);
            border-radius: 12px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 3000;
        }
        .color-picker-popup.open { display: flex; }
        .color-row { display: flex; gap: 6px; }
        .color-swatch {
            width: 24px; height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .color-swatch:hover { transform: scale(1.2); }
        .color-swatch.selected { border-color: white; transform: scale(1.15); }
        .nav-btn {
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.2s ease;
            position: relative;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
        }
        .nav-btn:hover { background: rgba(167,139,250,0.15); transform: scale(1.15); }
        .nav-btn::after {
            content: attr(data-tip);
            position: absolute;
            left: 52px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(20,20,35,0.95);
            color: white;
            font-family: 'Permanent Marker', cursive;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid rgba(167,139,250,0.2);
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s;
        }
        .nav-btn:hover::after { opacity: 1; left: 56px; }
        .nav-btn:hover img {
    filter: drop-shadow(0 0 8px #a78bfa) brightness(1.2) !important;
}
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15,23,42,0.85);
            z-index: -1;
        }
        #home-ui {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        .logo {
            font-size: 80px;
            font-weight: bold;
            background: linear-gradient(to right, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 5px;
        }
        .site-name {
            font-size: 28px;
            color: #d8b4fe;
            margin-bottom: 40px;
            letter-spacing: 4px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            background: rgba(30,41,59,0.9);
            padding: 10px;
            border-radius: 50px;
            border: 2px solid #a78bfa;
            width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 20px;
            padding-left: 25px;
        }
        button {
            background: #c084fc;
            color: #1e293b;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        #proxyFrame { width: 100%; height: 100%; border: none; }
        #back-btn {
            position: fixed;
            top: 20px; left: 20px;
            z-index: 99999;
            display: none;
            background: #c084fc;
            color: #1e293b;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: bold;
            pointer-events: auto;
        }
        #stats-counter {
            position: fixed;
            top: 16px; right: 20px;
            z-index: 9999;
            text-align: right;
            font-family: 'Permanent Marker', cursive;
            pointer-events: none;
        }
        .stat-line {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            text-shadow: 0 0 8px rgba(192,132,252,0.5);
            line-height: 1.6;
        }
        .stat-num { color: #c084fc; }

.auth-box {

}
.auth-box h2 {

.auth-input:focus { border-color: #a78bfa; background: rgba(167,139,250,0.08); }

}

.auth-switch span { color: #a78bfa; cursor: pointer; }

.auth-close:hover { color: white; }
.auth-box { position: relative; }
.auth-logged-in { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 8px; }
.auth-logged-in span { color: #c084fc; }
.auth-logout {
    margin-top: 16px;

.auth-logout:hover { background: rgba(255,80,80,0.25); }
    </style>
</head>
<body>
<button class="login-btn" onclick="openAuth()" id="loginBtn" title="Login">👤</button>

<a href="/movies" class="nav-btn" id="moviesBtn" data-tip="Movies"><img src="/icons/movies.png" width="28" height="28" style="filter:drop-shadow(0 0 0px #a78bfa);transition:filter 0.2s;"></a>
<a href="/music" class="nav-btn" id="musicBtn" data-tip="Music"><img src="/icons/music.png" width="28" height="28" style="filter:drop-shadow(0 0 0px #a78bfa);transition:filter 0.2s;"></a>

    <script>
        const conn = new BareMux.BareMuxConnection("/baremux/worker.js");
async function initTransport() {
    try {
        await conn.setTransport("/epoxy/dist/index.mjs", [{ wisp: `wss://${location.host}/wisp/` }]);
    } catch(e) {
        console.warn("Transport failed, retrying in 2s...", e);
        setTimeout(initTransport, 2000);
    }
}
        initTransport();
window.lastColor = '#ff2e73';
window.colorLocked = false;
function toggleColorPicker() {
            document.getElementById('colorPickerPopup').classList.toggle('open');
        }

        function pickColor(color, el) {
            window.lastColor = color;
            window.colorLocked = true;
            window._gradientColors = null;
            window._rainbowMode = false;
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('colorPickerPopup').classList.remove('open');
        }

        function pickGradientColor(gradientColors, el) {
            window.colorLocked = true;
            if (el.id === 'swatch_rainbow') {
                window._rainbowMode = true;
                window._gradientColors = null;
            } else {
                window._rainbowMode = false;
                window._gradientColors = gradientColors;
            }
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('colorPickerPopup').classList.remove('open');
        }
    </script>
    <script>
        const homeUI = document.getElementById('home-ui');
        const proxyContainer = document.getElementById('proxy-container');
        const frame = document.getElementById('proxyFrame');
        const backBtn = document.getElementById('back-btn');
        const input = document.getElementById('urlInput');
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const button = document.getElementById('goBtn');
        const spraySound = document.getElementById('spraySound');

        clearBtn.onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);

        const placeholderTexts = [
            "Grab a can and start spraying!", "Shout out to DevvyE_yo", "Pls join the discord",
            "Stud Tower Obby on Roblox!", "RAHH RAHH🛡️💀", "Manhattan cafe, search it up",
            "Rate Vandal: 1-10", "AI making people dumb, start reading", "Click the screen!",
            "Paint the web", "N_gge_ (It's nugget, u dirty mind)"
        ];
        input.placeholder = placeholderTexts[Math.floor(Math.random() * placeholderTexts.length)];

        async function launchProxy(event) {
            if (event) event.preventDefault();
            let url = input.value;
            if (!url) return;
            if (!url.startsWith('http')) {
                if (!url.includes('.')) {
                    url = 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
                } else {
                    url = 'https://' + url;
                }
            }
            homeUI.style.display = 'none';
            proxyContainer.style.display = 'block';
            backBtn.style.display = 'block';
            document.getElementById('spray-nav').style.display = 'none';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('loading-screen').style.display = 'flex';

            let progress = 0;
            const bar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const interval = setInterval(() => {
                if (progress < 85) {
                    progress += Math.random() * 8;
                    progress = Math.min(progress, 85);
                    bar.style.width = progress + '%';
                    progressText.textContent = Math.round(progress) + '%';
                }
            }, 300);

            frame.onload = () => {
                clearInterval(interval);
                bar.style.width = '100%';
                progressText.textContent = '100%';
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                    bar.style.width = '0%';
                    progressText.textContent = '0%';
                }, 300);
            };

            try {
                await registerSW();
                const encoded = __uv$config.encodeUrl(url);
frame.src = '/uv/service/' + encoded;
            } catch (err) {
                console.error("VANDAL Engine Error:", err);
            }
        }

        backBtn.onclick = () => {
            proxyContainer.style.display = 'none';
            homeUI.style.display = 'flex';
            backBtn.style.display = 'none';
            document.getElementById('spray-nav').style.display = 'flex';
            frame.src = 'about:blank';
        };

        button.onclick = (e) => launchProxy(e);
        input.onkeydown = (e) => { if (e.key === 'Enter') launchProxy(e); };

        // Painting
        let drawing = false;
        let mouseX, mouseY;
        const colors = ['#ff2e73', '#00f2ff', '#7000ff', '#ff8c00', '#00ff00'];


        function loadUnlockedColors() {
            const unlocked = JSON.parse(localStorage.getItem('vandal_unlocked_colors') || '[]');
            const popup = document.getElementById('colorPickerPopup');
            const gradientColors = {
                neon_pink:  { gradient: ['#ff6ec7', '#ff2e73'], label: 'Neon Pink' },
                ocean_blue: { gradient: ['#00f2ff', '#0070ff'], label: 'Ocean Blue' },
                gold_rush:  { gradient: ['#ffd700', '#ff8c00'], label: 'Gold Rush' },
                galaxy:     { gradient: ['#a78bfa', '#ec4899', '#f43f5e'], label: 'Galaxy' },
                rainbow: { gradient: ['#ff0000', '#ff8c00', '#ffff00', '#00ff00', '#00f2ff', '#7000ff', '#ff69b4'], label: 'Rainbow' }
            };
            unlocked.forEach(colorKey => {
                if (document.getElementById('swatch_' + colorKey)) return;
                const info = gradientColors[colorKey];
                if (!info) return;
                const row = document.createElement('div');
                row.className = 'color-row';
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.id = 'swatch_' + colorKey;
                swatch.style.background = 'linear-gradient(135deg,' + info.gradient.join(',') + ')';
                swatch.title = info.label;
                swatch.onclick = function() { pickGradientColor(info.gradient, this); };
                row.appendChild(swatch);
                popup.appendChild(row);
            });
        }

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize;
        resize();

function paint() {
    if (!drawing) return;
    const sprayRadius = 25, density = 40;
    if (!window._rainbowMode) {
        if (window._gradientColors) {
            const g = window._gradientColors;
            const grad = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 25);
            g.forEach((c, i) => grad.addColorStop(i / (g.length - 1), c));
            ctx.fillStyle = grad;
            ctx.shadowColor = g[0];
        } else {
            ctx.fillStyle = window.lastColor;
            ctx.shadowColor = window.lastColor;
        }
    }
    ctx.shadowBlur = 12;
    for (let i = 0; i < density; i++) {
        if (window._rainbowMode) {
            window._rainbowHue = ((window._rainbowHue || 0) + 5) % 360;
            ctx.fillStyle = `hsl(${window._rainbowHue}, 100%, 55%)`;
            ctx.shadowColor = `hsl(${window._rainbowHue}, 100%, 55%)`;
        }
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.pow(Math.random(), 2) * sprayRadius;
        const x = mouseX + radius * Math.cos(angle);
        const y = mouseY + radius * Math.sin(angle);
        ctx.beginPath();
        ctx.arc(x, y, Math.random() * 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

        let sprayInterval;
        document.addEventListener('mousedown', (e) => {
            if (proxyContainer.style.display === 'block') return;
            drawing = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
            if (!window.colorLocked) window.lastColor = colors[Math.floor(Math.random() * colors.length)];
                // Track used colors
    if (!window._gradientColors && !window._rainbowMode) {
        let usedColors = JSON.parse(localStorage.getItem('vandal_used_colors') || '[]');
        if (!usedColors.includes(window.lastColor)) {
            usedColors.push(window.lastColor);
            localStorage.setItem('vandal_used_colors', JSON.stringify(usedColors));
        }
        const allColors = ['#ff2e73','#00f2ff','#7000ff','#ff8c00','#00ff00','#ffffff','#ffff00','#ff69b4','#00ffaa','#ff4500'];
        if (allColors.every(c => usedColors.includes(c))) {
            localStorage.setItem('vandal_unlocked_colors', JSON.stringify(
                [...new Set([...JSON.parse(localStorage.getItem('vandal_unlocked_colors') || '[]'), 'rainbow'])]
            ));
        localStorage.setItem('vandal_unlocked_colors', JSON.stringify(
    [...new Set([...JSON.parse(localStorage.getItem('vandal_unlocked_colors') || '[]'), 'rainbow'])]
));
syncToServer();
        }
    }
            sprayInterval = setInterval(paint, 20);
            spraySound.currentTime = 0;
            spraySound.loop = true;
            spraySound.play().catch(() => {});
        });

        document.addEventListener('mousemove', (e) => {
            if (!drawing) return;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        document.addEventListener('mouseup', () => {
            drawing = false;
            clearInterval(sprayInterval);
            stopSpraySound();
        });

        function stopSpraySound() {
            let fade = setInterval(() => {
                if (spraySound.volume > 0.05) {
                    spraySound.volume -= 0.05;
                } else {
                    spraySound.pause();
                    spraySound.volume = 1;
                    clearInterval(fade);
                }
            }, 30);
        }

        document.addEventListener("click", () => {
            spraySound.play().catch(e => console.log(e));
        });

        async function updateStats() {
            try {
                const vRes = await fetch('/api/stats/visit');
                const vData = await vRes.json();
                document.getElementById('visitCount').textContent = vData.visits.toLocaleString();
            } catch(e) {}
            try {
                const oRes = await fetch('/api/stats/online');
                const oData = await oRes.json();
                document.getElementById('onlineCount').textContent = oData.online;
            } catch(e) {}
        }

        updateStats();
        loadUnlockedColors();

        setInterval(() => {
            const c = parseInt(localStorage.getItem('vandal_time_seconds') || '0');
            localStorage.setItem('vandal_time_seconds', c + 1);
        }, 1000);
    // AUTH
function openAuth() {
    document.getElementById('authModal').classList.add('open');
    const token = localStorage.getItem('vandal_token');
    if (token) renderLoggedIn();
    else renderLogin();
}

function closeAuth() {
    document.getElementById('authModal').classList.remove('open');
}

function renderLogin() {
    document.getElementById('authContent').innerHTML = `
        <h2>👤 VANDAL</h2>
        <div class="auth-subtitle">Login to save your progress</div>
        <input class="auth-input" id="authUser" placeholder="Username" maxlength="20">
        <input class="auth-input" id="authPass" placeholder="Password" type="password" maxlength="50">
        <div class="auth-error" id="authError"></div>
        <button class="auth-submit" onclick="doLogin()">Login</button>
        <div class="auth-switch">Don't have an account? <span onclick="renderSignup()">Sign up</span></div>
    `;
    document.getElementById('authUser').focus();
    document.getElementById('authUser').onkeydown = e => { if (e.key === 'Enter') document.getElementById('authPass').focus(); };
    document.getElementById('authPass').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
}

function renderSignup() {
    document.getElementById('authContent').innerHTML = `
        <h2>🎨 JOIN VANDAL</h2>
        <div class="auth-subtitle">Create an account to save your progress</div>
        <input class="auth-input" id="authUser" placeholder="Username (3-20 chars)" maxlength="20">
        <input class="auth-input" id="authPass" placeholder="Password (min 6 chars)" type="password" maxlength="50">
        <input class="auth-input" id="authPass2" placeholder="Confirm password" type="password" maxlength="50">
        <div class="auth-error" id="authError"></div>
        <button class="auth-submit" onclick="doSignup()">Create Account</button>
        <div class="auth-switch">Already have an account? <span onclick="renderLogin()">Login</span></div>
    `;
    document.getElementById('authUser').focus();
}

function renderLoggedIn() {
    const username = localStorage.getItem('vandal_username');
    document.getElementById('authContent').innerHTML = `
        <h2>👤 VANDAL</h2>
        <div class="auth-logged-in">Logged in as <span>${username}</span></div>
        <div class="auth-subtitle" style="margin-top:8px;">Your progress is being saved!</div>
        <button class="auth-logout" onclick="doLogout()">Logout</button>
    `;
}

async function doLogin() {
    const username = document.getElementById('authUser').value.trim();
    const password = document.getElementById('authPass').value;
    if (!username || !password) { document.getElementById('authError').textContent = 'Fill in all fields'; return; }
    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { document.getElementById('authError').textContent = data.error; return; }
        localStorage.setItem('vandal_token', data.token);
        localStorage.setItem('vandal_username', data.username);
        localStorage.setItem('vandal_unlocked_colors', JSON.stringify(data.unlockedColors || []));
localStorage.setItem('vandal_time_seconds', (data.timeSeconds || 0).toString());
localStorage.setItem('vandal_used_colors', JSON.stringify(data.usedColors || []));
        loadUnlockedColors();
        renderLoggedIn();
        syncToServer();
        location.reload();
    } catch(e) {
        document.getElementById('authError').textContent = 'Connection error';
    }
}

async function doSignup() {
    const username = document.getElementById('authUser').value.trim();
    const password = document.getElementById('authPass').value;
    const password2 = document.getElementById('authPass2').value;
    if (!username || !password) { document.getElementById('authError').textContent = 'Fill in all fields'; return; }
    if (password !== password2) { document.getElementById('authError').textContent = 'Passwords do not match'; return; }
    try {
        const res = await fetch('/api/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { document.getElementById('authError').textContent = data.error; return; }
        localStorage.setItem('vandal_token', data.token);
        localStorage.setItem('vandal_username', data.username);
        renderLoggedIn();
        syncToServer();
        location.reload();
    } catch(e) {
        document.getElementById('authError').textContent = 'Connection error';
    }
}

function doLogout() {
    localStorage.removeItem('vandal_token');
    localStorage.removeItem('vandal_username');
    location.reload();
    renderLogin();
}

async function syncToServer() {
    const token = localStorage.getItem('vandal_token');
    if (!token) return;
    try {
        await fetch('/api/auth/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({
                unlockedColors: JSON.parse(localStorage.getItem('vandal_unlocked_colors') || '[]'),
                timeSeconds: parseInt(localStorage.getItem('vandal_time_seconds') || '0'),
                usedColors: JSON.parse(localStorage.getItem('vandal_used_colors') || '[]')
            })
        });
    } catch(e) {}
}

// Sync every 60 seconds if logged in
setInterval(syncToServer, 60000);

// Update login button to show logged in state
function updateLoginBtn() {
    const token = localStorage.getItem('vandal_token');
    const btn = document.getElementById('loginBtn');
    if (token) {
        btn.textContent = '✅';
        btn.title = 'Logged in as ' + localStorage.getItem('vandal_username');
    } else {
        btn.textContent = '👤';
        btn.title = 'Login';
    }
}
updateLoginBtn();
