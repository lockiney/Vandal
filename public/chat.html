<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/logo.png">
    <title>Vandal - Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Permanent Marker', cursive;
            background: #0a0a0f;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* TOP BAR */
        .topbar {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            gap: 16px;
            flex-shrink: 0;
        }
        .back-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); }
        .topbar-title {
            font-size: 22px;
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }
        .topbar-right {
            margin-left: auto;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .online-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* USERNAME MODAL */
        #usernameModal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-box {
            background: #1a1a2e;
            border: 1px solid rgba(167,139,250,0.3);
            border-radius: 16px;
            padding: 32px;
            max-width: 380px;
            width: 90%;
            text-align: center;
        }
        .modal-box h2 {
            font-size: 24px;
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .modal-box p {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 20px;
        }
        .modal-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(167,139,250,0.3);
            border-radius: 10px;
            color: white;
            font-family: 'Permanent Marker', cursive;
            font-size: 16px;
            outline: none;
            text-align: center;
            margin-bottom: 16px;
            transition: all 0.2s;
        }
        .modal-input:focus { border-color: #a78bfa; background: rgba(167,139,250,0.08); }
        .modal-input::placeholder { color: rgba(255,255,255,0.25); }
        .modal-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Permanent Marker', cursive;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-btn:hover { opacity: 0.9; }

        /* MESSAGES */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #messages::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.3); border-radius: 2px; }

        .msg {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            animation: fadeUp 0.2s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.mine { align-self: flex-end; align-items: flex-end; }
        .msg.theirs { align-self: flex-start; align-items: flex-start; }

        .msg-meta {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 4px;
            display: flex;
            gap: 6px;
        }
        .msg-username { color: #a78bfa; }
        .msg.mine .msg-username { color: #c084fc; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }
        .msg.mine .msg-bubble {
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            color: #1a0a2e;
            border-bottom-right-radius: 4px;
        }
        .msg.theirs .msg-bubble {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.9);
            border-bottom-left-radius: 4px;
        }

        .msg-img {
            max-width: 220px;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 6px;
            cursor: pointer;
            display: block;
        }

        /* USERNAME TAG */
        .user-tag {
            font-size: 12px;
            color: rgba(255,255,255,0.25);
            padding: 5px 20px;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .change-name-btn {
            color: #a78bfa;
            cursor: pointer;
            font-size: 11px;
            background: none;
            border: none;
            font-family: 'Permanent Marker', cursive;
        }
        .change-name-btn:hover { text-decoration: underline; }

        /* IMAGE PREVIEW */
        .img-preview-bar {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 7px 20px;
            background: rgba(167,139,250,0.07);
            border-top: 1px solid rgba(167,139,250,0.15);
            flex-shrink: 0;
        }
        .img-preview-bar.show { display: flex; }
        .img-thumb { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; }
        .img-name { font-size: 12px; color: rgba(255,255,255,0.45); flex: 1; }
        .img-remove {
            background: none; border: none;
            color: rgba(255,255,255,0.35);
            cursor: pointer; font-size: 18px;
        }
        .img-remove:hover { color: #ff5050; }

        /* INPUT BAR */
        .input-bar {
            display: flex;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.02);
            border-top: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .chat-input {
            flex: 1;
            padding: 11px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(167,139,250,0.3);
            border-radius: 50px;
            color: white;
            font-family: 'Permanent Marker', cursive;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input:focus { border-color: #a78bfa; }
        .chat-input::placeholder { color: rgba(255,255,255,0.2); }
        .attach-btn {
            padding: 11px 15px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(167,139,250,0.3);
            border-radius: 50px;
            color: rgba(255,255,255,0.6);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .attach-btn:hover { background: rgba(167,139,250,0.15); color: white; }
        .send-btn {
            padding: 11px 20px;
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            border: none;
            border-radius: 50px;
            color: white;
            font-family: 'Permanent Marker', cursive;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .send-btn:hover { opacity: 0.88; }
        .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        /* LIGHTBOX */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }
        #lightbox.show { display: flex; }
        #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 10px; }
    </style>
</head>
<body>

<div id="usernameModal">
    <div class="modal-box">
        <h2>💬 VANDAL CHAT</h2>
        <p>Pick a spray tag to chat with</p>
        <input class="modal-input" id="nameInput" placeholder="Your spray tag..." maxlength="20">
        <button class="modal-btn" id="nameBtn">Enter Chat 🎨</button>
    </div>
</div>

<div class="topbar">
    <a href="/" class="back-btn">← Back</a>
    <div class="topbar-title">💬 VANDAL CHAT</div>
    <div class="topbar-right">
        <div class="online-dot"></div>
        <span>Global Chat</span>
    </div>
</div>

<div id="messages"></div>

<div class="user-tag">
    <span id="userTag"></span>
    <button class="change-name-btn" id="changeNameBtn">Change name</button>
</div>

<div class="img-preview-bar" id="imgPreviewBar">
    <img class="img-thumb" id="imgThumb" src="" alt="">
    <span class="img-name" id="imgName"></span>
    <button class="img-remove" onclick="removeImage()">✕</button>
</div>

<div class="input-bar">
    <input class="chat-input" id="chatInput" placeholder="Say something..." maxlength="500">
    <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <button class="send-btn" id="sendBtn">Send 🖌️</button>
</div>

<div id="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="">
</div>

<script>
document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') {
        e.preventDefault();
    }
});
(function() {
    let username = localStorage.getItem('vandal_chat_username') || '';
    let lastId = 0;
    let pendingImage = null;

    // ── USERNAME MODAL ─────────────────────────────────
    const modal = document.getElementById('usernameModal');
    const nameInput = document.getElementById('nameInput');
    const nameBtn = document.getElementById('nameBtn');

    function enterChat(name) {
        username = name.trim();
        localStorage.setItem('vandal_chat_username', username);
        document.getElementById('userTag').textContent = 'Chatting as: ' + username;
        modal.style.display = 'none';
        loadMessages();
        setInterval(loadMessages, 2000);
        document.getElementById('chatInput').focus();
    }

    if (username) {
        enterChat(username);
    } else {
        modal.style.display = 'flex';
        nameInput.focus();
    }

    nameBtn.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (!name) return;
        enterChat(name);
    });

    nameInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') nameBtn.click();
    });

    document.getElementById('changeNameBtn').addEventListener('click', () => {
        nameInput.value = username;
        modal.style.display = 'flex';
        nameInput.focus();
    });

    // ── IMAGE ──────────────────────────────────────────
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 500 * 1024) { alert('Max image size is 500KB!'); return; }
        const reader = new FileReader();
        reader.onload = ev => {
            pendingImage = ev.target.result;
            document.getElementById('imgThumb').src = pendingImage;
            document.getElementById('imgName').textContent = file.name;
            document.getElementById('imgPreviewBar').classList.add('show');
        };
        reader.readAsDataURL(file);
        this.value = '';
    });

    function removeImage() {
        pendingImage = null;
        document.getElementById('imgPreviewBar').classList.remove('show');
        document.getElementById('imgThumb').src = '';
    }
    window.removeImage = removeImage;

    // ── LIGHTBOX ───────────────────────────────────────
    const lightbox = document.getElementById('lightbox');
    lightbox.addEventListener('click', () => lightbox.classList.remove('show'));

    function openLightbox(src) {
        document.getElementById('lightboxImg').src = src;
        lightbox.classList.add('show');
    }

    // ── ESCAPE HTML ────────────────────────────────────
    function esc(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;');
    }

    // ── RENDER MESSAGE ─────────────────────────────────
function renderMsg(msg) {
        const isMine = msg.username === username;
        const div = document.createElement('div');
        div.className = 'msg ' + (isMine ? 'mine' : 'theirs');
        div.innerHTML = `
            <div class="msg-meta">
                <span class="msg-username">${isMine ? 'You' : esc(msg.username)}</span>
                <span>${esc(msg.time)}</span>
            </div>
            <div class="msg-bubble">
                ${msg.message ? esc(msg.message) : ''}
            </div>
        `;
        // Safely add image only if it's a real image data URL
        if (msg.image && typeof msg.image === 'string' && msg.image.startsWith('data:image/')) {
            const bubble = div.querySelector('.msg-bubble');
            const imgEl = document.createElement('img');
            imgEl.className = 'msg-img';
            imgEl.alt = 'image';
            imgEl.src = msg.image;
            imgEl.addEventListener('click', () => openLightbox(imgEl.src));
            bubble.appendChild(imgEl);
        }
        return div;
    }

    // ── LOAD MESSAGES ──────────────────────────────────
    async function loadMessages() {
        try {
            const res = await fetch('/api/chat/messages');
            if (!res.ok) return;
            const msgs = await res.json();
            const newMsgs = msgs.filter(m => m.id > lastId);
            if (!newMsgs.length) return;
            const container = document.getElementById('messages');
            const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 80;
            newMsgs.forEach(m => {
                lastId = Math.max(lastId, m.id);
                container.appendChild(renderMsg(m));
            });
            if (atBottom) container.scrollTop = container.scrollHeight;
        } catch(e) {}
    }

    // ── SEND MESSAGE ───────────────────────────────────
    async function sendMessage() {
        if (!username) return;
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg && !pendingImage) return;
        const btn = document.getElementById('sendBtn');
        btn.disabled = true;
        input.value = '';
        const imgToSend = pendingImage;
        removeImage();
        try {
            await fetch('/api/chat/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, message: msg, image: imgToSend })
            });
            await loadMessages();
        } catch(e) {}
        btn.disabled = false;
        input.focus();
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('chatInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') sendMessage();
    });

    // Time tracker
    setInterval(() => {
        const c = parseInt(localStorage.getItem('vandal_time_seconds') || '0');
        localStorage.setItem('vandal_time_seconds', c + 1);
    }, 1000);
})();
</script>
</body>
</html>
