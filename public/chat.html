<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vandal - Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Permanent Marker', cursive;
            background: #0a0a0f;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* TOPBAR */
        .topbar {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            gap: 16px;
            flex-shrink: 0;
        }

        .back-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); }

        .topbar-title {
            font-size: 22px;
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }

        .online-count {
            margin-left: auto;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .online-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* USERNAME MODAL */
        #usernameModal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: #1a1a2e;
            border: 1px solid rgba(167,139,250,0.3);
            border-radius: 16px;
            padding: 32px;
            max-width: 380px;
            width: 90%;
            text-align: center;
        }

        .modal-box h2 {
            font-size: 24px;
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .modal-box p {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(167,139,250,0.3);
            border-radius: 10px;
            color: white;
            font-family: 'Permanent Marker', cursive;
            font-size: 16px;
            outline: none;
            text-align: center;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .modal-input:focus {
            border-color: #a78bfa;
            background: rgba(167,139,250,0.08);
        }

        .modal-input::placeholder { color: rgba(255,255,255,0.25); }

        .modal-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Permanent Marker', cursive;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn:hover { opacity: 0.9; transform: scale(1.02); }

        /* CHAT AREA */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #messages::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.3); border-radius: 2px; }

        .msg {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.mine { align-self: flex-end; align-items: flex-end; }
        .msg.theirs { align-self: flex-start; align-items: flex-start; }

        .msg-meta {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 4px;
            display: flex;
            gap: 6px;
        }

        .msg-username { color: #a78bfa; }
        .msg.mine .msg-username { color: #c084fc; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .msg.mine .msg-bubble {
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            color: #1a0a2e;
            border-bottom-right-radius: 4px;
        }

        .msg.theirs .msg-bubble {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.9);
            border-bottom-left-radius: 4px;
        }

        .system-msg {
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.25);
            padding: 4px 0;
        }

        /* INPUT BAR */
        .input-bar {
            display: flex;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.02);
            border-top: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(167,139,250,0.3);
            border-radius: 50px;
            color: white;
            font-family: 'Permanent Marker', cursive;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .chat-input:focus {
            border-color: #a78bfa;
            background: rgba(167,139,250,0.08);
        }

        .chat-input::placeholder { color: rgba(255,255,255,0.25); }

        .send-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #a78bfa, #c084fc);
            border: none;
            border-radius: 50px;
            color: white;
            font-family: 'Permanent Marker', cursive;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .send-btn:hover { opacity: 0.9; transform: scale(1.02); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .username-tag {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            padding: 0 20px 8px;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .change-name {
            color: #a78bfa;
            cursor: pointer;
            font-size: 11px;
            background: none;
            border: none;
            font-family: 'Permanent Marker', cursive;
        }

        .change-name:hover { text-decoration: underline; }
    </style>
</head>
<body>

<!-- Username Modal -->
<div id="usernameModal">
    <div class="modal-box">
        <h2>💬 VANDAL CHAT</h2>
        <p>Pick a username to join the global chatroom</p>
        <input type="text" class="modal-input" id="usernameInput" placeholder="Your username..." maxlength="20">
        <button class="modal-btn" onclick="setUsername()">Join Chat 🎨</button>
    </div>
</div>

<!-- Top Bar -->
<div class="topbar">
    <a href="/" class="back-btn">← Back</a>
    <div class="topbar-title">💬 VANDAL CHAT</div>
    <div class="online-count">
        <div class="online-dot"></div>
        <span id="onlineCount">Global Chat</span>
    </div>
</div>

<!-- Messages -->
<div id="messages"></div>

<!-- Username tag + input -->
<div class="username-tag">
    <span id="usernameTag">Not joined</span>
    <button class="change-name" onclick="changeName()">Change name</button>
</div>

<div class="input-bar">
    <input type="text" class="chat-input" id="chatInput" placeholder="Say something..." maxlength="500" onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send 🖌️</button>
</div>

<script>
    let username = localStorage.getItem('vandal_chat_username') || '';
    let lastMessageId = 0;
    let pollInterval;

    // Auto-show modal or skip if username exists
    if (username) {
        document.getElementById('usernameModal').style.display = 'none';
        document.getElementById('usernameTag').textContent = 'You: ' + username;
        startChat();
    } else {
        document.getElementById('usernameInput').focus();
    }

    document.getElementById('usernameInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') setUsername();
    });

    function setUsername() {
        const input = document.getElementById('usernameInput').value.trim();
        if (!input) return;
        username = input;
        localStorage.setItem('vandal_chat_username', username);
        document.getElementById('usernameModal').style.display = 'none';
        document.getElementById('usernameTag').textContent = 'You: ' + username;
        startChat();
    }

    function changeName() {
        document.getElementById('usernameInput').value = username;
        document.getElementById('usernameModal').style.display = 'flex';
        document.getElementById('usernameInput').focus();
        clearInterval(pollInterval);
    }

    function startChat() {
        loadMessages();
        pollInterval = setInterval(loadMessages, 2000);
        document.getElementById('chatInput').focus();
    }

    async function loadMessages() {
        try {
            const res = await fetch('/api/chat/messages');
            const msgs = await res.json();
            if (!msgs.length) return;

            const newMsgs = msgs.filter(m => m.id > lastMessageId);
            if (!newMsgs.length) return;

            const container = document.getElementById('messages');
            const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;

            newMsgs.forEach(msg => {
                lastMessageId = Math.max(lastMessageId, msg.id);
                const isMine = msg.username === username;
                const div = document.createElement('div');
                div.className = `msg ${isMine ? 'mine' : 'theirs'}`;
                div.innerHTML = `
                    <div class="msg-meta">
                        <span class="msg-username">${isMine ? 'You' : msg.username}</span>
                        <span>${msg.time}</span>
                    </div>
                    <div class="msg-bubble">${escapeHtml(msg.message)}</div>
                `;
                container.appendChild(div);
            });

            if (wasAtBottom) {
                container.scrollTop = container.scrollHeight;
            }
        } catch(e) {}
    }

    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const message = input.value.trim();
        if (!message || !username) return;

        const btn = document.getElementById('sendBtn');
        btn.disabled = true;
        input.value = '';

        try {
            await fetch('/api/chat/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, message })
            });
            await loadMessages();
        } catch(e) {}

        btn.disabled = false;
        input.focus();
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }
</script>
</body>
</html>
