<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vandal - Suggestions</title>
<script>
if (!localStorage.getItem('vandal_token')) {
    window.location.href = '/';
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Permanent Marker', cursive;
        background: #0a0a0f;
        color: #e8e8f0;
        min-height: 100vh;
        padding: 30px 20px 60px;
        letter-spacing: 0.5px;
    }
    .topbar {
        max-width: 900px;
        margin: 0 auto 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .back {
        color: #8a8aff;
        text-decoration: none;
        font-size: 17px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .back:hover { color: #b0b0ff; }
    h1 {
        font-size: 28px;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .add-btn {
        background: #6a5cff;
        border: none;
        color: #fff;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        font-size: 26px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform .15s, box-shadow .15s;
        font-family: 'Permanent Marker', cursive;
    }
    .add-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 0 18px rgba(106,92,255,.6);
    }
    .container { max-width: 900px; margin: 0 auto; }
    .sort-row {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
    }
    .sort-btn {
        background: #15151f;
        border: 1px solid #25253a;
        color: #8a8aaa;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
        cursor: pointer;
        font-family: 'Permanent Marker', cursive;
        transition: all .15s;
    }
    .sort-btn:hover { border-color: #4a4a7a; color: #b0b0c5; }
    .sort-btn.active {
        background: #1e1a3a;
        border-color: #6a5cff;
        color: #b8a8ff;
    }
    .card {
        background: #15151f;
        border: 1px solid #25253a;
        border-radius: 14px;
        padding: 18px 20px;
        margin-bottom: 14px;
        position: relative;
        transition: border-color .15s, transform .12s;
    }
    .card:hover { border-color: #4a4a7a; transform: translateY(-2px); }
    .card-title {
        font-size: 22px;
        margin-bottom: 8px;
        padding-right: 90px;
        word-break: break-word;
    }
    .card-desc {
        color: #b0b0c5;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 12px;
        white-space: pre-wrap;
        word-break: break-word;
    }
    .card-meta {
        display: flex;
        gap: 16px;
        font-size: 14px;
        color: #7a7a9a;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
    }
    .card-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }
    .vote-btn {
        background: #0d0d15;
        border: 1px solid #2a2a40;
        color: #8a8aaa;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 15px;
        cursor: pointer;
        font-family: 'Permanent Marker', cursive;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        transition: all .15s;
    }
    .vote-btn:hover { transform: translateY(-1px); }
    .vote-btn.like:hover { border-color: #4a8a5a; color: #7affb0; }
    .vote-btn.dislike:hover { border-color: #8a4a5a; color: #ff8a8a; }
    .vote-btn.like.active {
        background: #122a1a;
        border-color: #4a8a5a;
        color: #7affb0;
    }
    .vote-btn.dislike.active {
        background: #2a1218;
        border-color: #8a4a5a;
        color: #ff8a8a;
    }
    .chat-btn {
        background: #0d0d15;
        border: 1px solid #2a2a40;
        color: #8a8aaa;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 15px;
        cursor: pointer;
        font-family: 'Permanent Marker', cursive;
        margin-left: auto;
        transition: all .15s;
    }
    .chat-btn:hover { border-color: #6a5cff; color: #b8a8ff; }
    .score {
        font-size: 14px;
        color: #6a6a8a;
    }
    .score.positive { color: #7affb0; }
    .score.negative { color: #ff8a8a; }
    .remove-btn {
        position: absolute;
        top: 14px;
        right: 14px;
        background: #2a1520;
        border: 1px solid #5a2535;
        color: #ff8a8a;
        padding: 5px 12px;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        font-family: 'Permanent Marker', cursive;
        z-index: 2;
    }
    .remove-btn:hover { background: #3a1a2a; }
    .empty {
        text-align: center;
        color: #5a5a7a;
        padding: 40px 0;
        font-size: 17px;
    }

    /* Overlay shared */
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.7);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 100;
    }
    .overlay.show { display: flex; }

    /* Create modal */
    .modal {
        background: #15151f;
        border: 1px solid #2a2a40;
        border-radius: 16px;
        padding: 26px;
        width: 100%;
        max-width: 420px;
        font-family: 'Permanent Marker', cursive;
    }
    .modal h2 { font-size: 22px; margin-bottom: 18px; }
    .modal label {
        display: block;
        font-size: 14px;
        color: #9a9aba;
        margin: 12px 0 5px;
    }
    .modal input, .modal textarea {
        width: 100%;
        background: #0d0d15;
        border: 1px solid #2a2a40;
        border-radius: 9px;
        padding: 10px 12px;
        color: #e8e8f0;
        font-size: 15px;
        font-family: 'Permanent Marker', cursive;
    }
    .modal input:focus, .modal textarea:focus {
        outline: none;
        border-color: #6a5cff;
    }
    .modal textarea { resize: vertical; min-height: 90px; }
    .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 22px;
    }
    .modal-actions button {
        flex: 1;
        padding: 11px;
        border-radius: 9px;
        border: none;
        font-size: 16px;
        cursor: pointer;
        font-family: 'Permanent Marker', cursive;
    }
    .btn-cancel { background: #25253a; color: #c0c0d5; }
    .btn-create { background: #6a5cff; color: #fff; }
    .btn-create:disabled { opacity: .5; cursor: not-allowed; }
    .err {
        color: #ff8a8a;
        font-size: 14px;
        margin-top: 12px;
        min-height: 16px;
    }

    /* Chat view */
    .chat-modal {
        background: #12121a;
        border: 1px solid #2a2a40;
        border-radius: 16px;
        width: 100%;
        max-width: 520px;
        height: 80vh;
        max-height: 640px;
        display: flex;
        flex-direction: column;
        font-family: 'Permanent Marker', cursive;
        overflow: hidden;
    }
    .chat-head {
        padding: 18px 20px;
        border-bottom: 1px solid #25253a;
        flex-shrink: 0;
    }
    .chat-head .ch-title { font-size: 21px; padding-right: 30px; word-break: break-word; }
    .chat-head .ch-by { color: #7a7a9a; font-size: 14px; margin-top: 3px; }
    .chat-head .ch-close {
        position: absolute;
        top: 14px;
        right: 18px;
        font-size: 26px;
        color: #8a8aaa;
        cursor: pointer;
        background: none;
        border: none;
        font-family: 'Permanent Marker', cursive;
    }
    .chat-msgs {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .msg .msg-user {
        font-size: 13px;
        color: #8a8aff;
        margin-bottom: 2px;
    }
    .msg .msg-user.op { color: #b8a8ff; }
    .msg .msg-text {
        font-size: 16px;
        color: #e0e0f0;
        word-break: break-word;
    }
    .chat-input-row {
        display: flex;
        gap: 8px;
        padding: 14px 16px;
        border-top: 1px solid #25253a;
        flex-shrink: 0;
    }
    .chat-input-row input {
        flex: 1;
        background: #0d0d15;
        border: 1px solid #2a2a40;
        border-radius: 9px;
        padding: 10px 12px;
        color: #e8e8f0;
        font-size: 15px;
        font-family: 'Permanent Marker', cursive;
    }
    .chat-input-row input:focus { outline: none; border-color: #6a5cff; }
    .chat-input-row button {
        background: #6a5cff;
        color: #fff;
        border: none;
        border-radius: 9px;
        padding: 0 18px;
        font-size: 16px;
        cursor: pointer;
        font-family: 'Permanent Marker', cursive;
    }
</style>

<body>
    <div class="topbar">
        <a href="/" class="back">← Back</a>
        <h1>💡 Suggestions</h1>
        <button class="add-btn" id="addBtn" title="New suggestion">+</button>
    </div>

    <div class="container">
        <div class="sort-row">
            <button class="sort-btn active" data-sort="new">Newest</button>
            <button class="sort-btn" data-sort="top">Top Rated</button>
        </div>
        <div id="listWrap"></div>
    </div>

    <!-- Create modal -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <h2>New Suggestion</h2>
            <label>Title</label>
            <input id="f-title" maxlength="100" placeholder="e.g. Add a dark mode toggle">
            <label>Description</label>
            <textarea id="f-desc" maxlength="1000" placeholder="Explain your idea..."></textarea>
            <div class="err" id="formErr"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="cancelBtn">Cancel</button>
                <button class="btn-create" id="createBtn">Post</button>
            </div>
        </div>
    </div>

    <!-- Chat view -->
    <div class="overlay" id="chatOverlay">
        <div class="chat-modal">
            <div class="chat-head" style="position:relative;">
                <button class="ch-close" id="chatClose">×</button>
                <div class="ch-title" id="chatTitle"></div>
                <div class="ch-by" id="chatBy"></div>
            </div>
            <div class="chat-msgs" id="chatMsgs"></div>
            <div class="chat-input-row" id="chatInputRow">
                <input id="chatInput" maxlength="500" placeholder="Discuss this idea...">
                <button id="chatSend">Send</button>
            </div>
        </div>
    </div>

<script>
const token = localStorage.getItem('vandal_token');
let myUsername = null;
let suggestions = [];
let openSuggestionId = null;
let openSuggestionCreator = null;
let chatPoll = null;
let sortMode = 'new';

async function loadMe() {
    try {
        const res = await fetch('/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.ok) {
            const data = await res.json();
            myUsername = data.username;
        }
    } catch (e) {}
}

function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function fmtAge(ts) {
    const diff = Date.now() - ts;
    const m = Math.floor(diff / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    const d = Math.floor(h / 24);
    return d + 'd ago';
}

async function loadSuggestions() {
    try {
        const res = await fetch('/api/suggestions', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        suggestions = await res.json();
    } catch (e) {
        suggestions = [];
    }
    render();
}

function render() {
    const list = suggestions.slice();
    if (sortMode === 'top') {
        list.sort((a, b) => b.score - a.score || b.createdAt - a.createdAt);
    } else {
        list.sort((a, b) => b.createdAt - a.createdAt);
    }

    const wrap = document.getElementById('listWrap');
    if (list.length === 0) {
        wrap.innerHTML = '<div class="empty">No suggestions yet. Share the first idea! 💡</div>';
        return;
    }
    wrap.innerHTML = list.map(cardHtml).join('');
}

function cardHtml(s) {
    const removeBtn = (myUsername === 'lockiney')
        ? '<button class="remove-btn" data-id="' + s.id + '">Remove</button>'
        : '';
    const desc = s.description
        ? '<div class="card-desc">' + escapeHtml(s.description) + '</div>'
        : '';
    const scoreClass = s.score > 0 ? 'positive' : (s.score < 0 ? 'negative' : '');
    const scoreTxt = (s.score > 0 ? '+' : '') + s.score;
    return '<div class="card">' +
        removeBtn +
        '<div class="card-title">' + escapeHtml(s.title) + '</div>' +
        desc +
        '<div class="card-meta">' +
            '<span>by ' + escapeHtml(s.creator) + '</span>' +
            '<span>' + fmtAge(s.createdAt) + '</span>' +
            '<span class="score ' + scoreClass + '">' + scoreTxt + '</span>' +
        '</div>' +
        '<div class="card-actions">' +
            '<button class="vote-btn like' + (s.myVote === 'like' ? ' active' : '') + '" ' +
                'data-vote="like" data-id="' + s.id + '">👍 ' + s.likes + '</button>' +
            '<button class="vote-btn dislike' + (s.myVote === 'dislike' ? ' active' : '') + '" ' +
                'data-vote="dislike" data-id="' + s.id + '">👎 ' + s.dislikes + '</button>' +
            '<button class="chat-btn" data-open="' + s.id + '" data-creator="' + escapeHtml(s.creator) + '">' +
                '💬 Discuss (' + s.messageCount + ')</button>' +
        '</div>' +
    '</div>';
}

// Sort toggle
document.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        sortMode = btn.dataset.sort;
        render();
    });
});

// Clicks: vote, remove, open chat
document.addEventListener('click', async e => {
    // vote
    const voteBtn = e.target.closest('.vote-btn');
    if (voteBtn) {
        const id = voteBtn.dataset.id;
        const vote = voteBtn.dataset.vote;
        try {
            const res = await fetch('/api/suggestions/' + id + '/vote', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ vote })
            });
            if (res.ok) {
                const updated = await res.json();
                const i = suggestions.findIndex(s => s.id === id);
                if (i !== -1) suggestions[i] = updated;
                render();
            } else {
                const d = await res.json();
                alert(d.error || 'Vote failed');
            }
        } catch (err) {
            alert('Network error');
        }
        return;
    }

    // remove
    if (e.target.classList.contains('remove-btn')) {
        e.stopPropagation();
        const id = e.target.dataset.id;
        if (!confirm('Remove this suggestion?')) return;
        try {
            const res = await fetch('/api/suggestions/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                loadSuggestions();
            } else {
                const d = await res.json();
                alert(d.error || 'Failed to remove');
            }
        } catch (err) {
            alert('Network error');
        }
        return;
    }

    // open discussion
    const chatBtn = e.target.closest('.chat-btn[data-open]');
    if (chatBtn) {
        openChat(chatBtn.dataset.open);
    }
});

// ---- Chat view ----
const chatOverlay = document.getElementById('chatOverlay');

async function openChat(id) {
    openSuggestionId = id;
    chatOverlay.classList.add('show');
    await refreshChat();
    if (chatPoll) clearInterval(chatPoll);
    chatPoll = setInterval(refreshChat, 3000);
}

function closeChat() {
    chatOverlay.classList.remove('show');
    openSuggestionId = null;
    openSuggestionCreator = null;
    if (chatPoll) { clearInterval(chatPoll); chatPoll = null; }
    loadSuggestions();
}

document.getElementById('chatClose').addEventListener('click', closeChat);
chatOverlay.addEventListener('click', e => {
    if (e.target === chatOverlay) closeChat();
});

async function refreshChat() {
    if (!openSuggestionId) return;
    try {
        const res = await fetch('/api/suggestions/' + openSuggestionId + '/messages');
        if (!res.ok) return;
        const data = await res.json();
        openSuggestionCreator = data.creator;
        document.getElementById('chatTitle').textContent = data.title;
        document.getElementById('chatBy').textContent = 'suggested by ' + data.creator;

        const msgsEl = document.getElementById('chatMsgs');
        const atBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 60;
        msgsEl.innerHTML = (data.messages || []).map(m => {
            const isOp = m.user === data.creator;
            return '<div class="msg">' +
                '<div class="msg-user' + (isOp ? ' op' : '') + '">' +
                    escapeHtml(m.user) + (isOp ? ' 💡' : '') + '</div>' +
                '<div class="msg-text">' + escapeHtml(m.text) + '</div>' +
            '</div>';
        }).join('');
        if (atBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
    } catch (e) {}
}

async function sendChatMsg() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !openSuggestionId) return;
    input.value = '';
    try {
        const res = await fetch('/api/suggestions/' + openSuggestionId + '/messages', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ text })
        });
        if (!res.ok) {
            const d = await res.json();
            if (d.error) alert(d.error);
        }
        refreshChat();
    } catch (e) {}
}

document.getElementById('chatSend').addEventListener('click', sendChatMsg);
document.getElementById('chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendChatMsg(); }
});

// ---- Create modal ----
const overlay = document.getElementById('overlay');
document.getElementById('addBtn').addEventListener('click', () => {
    document.getElementById('formErr').textContent = '';
    overlay.classList.add('show');
});
document.getElementById('cancelBtn').addEventListener('click', () => {
    overlay.classList.remove('show');
});
overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('show');
});

document.getElementById('createBtn').addEventListener('click', async () => {
    const title = document.getElementById('f-title').value.trim();
    const description = document.getElementById('f-desc').value.trim();
    const errEl = document.getElementById('formErr');
    const btn = document.getElementById('createBtn');

    if (!title) {
        errEl.textContent = 'A title is required.';
        return;
    }
    btn.disabled = true;
    try {
        const res = await fetch('/api/suggestions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ title, description })
        });
        const data = await res.json();
        if (res.ok) {
            overlay.classList.remove('show');
            document.getElementById('f-title').value = '';
            document.getElementById('f-desc').value = '';
            loadSuggestions();
        } else {
            errEl.textContent = data.error || 'Failed to post.';
        }
    } catch (err) {
        errEl.textContent = 'Network error.';
    }
    btn.disabled = false;
});

// Init
(async () => {
    await loadMe();
    await loadSuggestions();
})();
</script>
</body>
</html>
